[project]
name = "bonding-game-api"
version = "0.2.0"
description = "Authenticated learning and private-room API"
requires-python = ">=3.13"
dependencies = [
    'fastapi>=0.115,<1',
    'uvicorn[standard]>=0.34,<1',
    'httpx>=0.28,<1',
    'pydantic-settings>=2.7,<3',
    'email-validator>=2.2,<3',
    'anthropic>=1.17.0',
    'beautifulsoup4>=4.15.0',
    'langchain>=1.4.7',
    'langchain-anthropic>=1.7.6',
    'langchain-community>=0.4.2',
    'langchain-core>=1.7.0',
    'langchain-openai>=1.7.2',
    'langchain-text-splitters>=1.1.3',
    'langgraph>=1.2.17',
    'openai>=3.37.0',
    'openpyxl>=3.1.5',
    'pandas>=3.1.0',
    'pillow>=13.0.0',
    'pydantic>=2.14.1',
    'pypdf>=6.21.2',
    'pypdfium2>=5.14.0',
    'python-docx>=1.2.0',
    'python-dotenv>=1.2.4',
    'python-multipart>=0.0.32',
    'tiktoken>=0.14.0',
    'psycopg[binary,pool]>=3.2,<4',
    'chromadb>=0.6,<2',
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "fpdf2>=2.8.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
