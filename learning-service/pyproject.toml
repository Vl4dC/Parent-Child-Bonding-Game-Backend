[project]
name = "hackathon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.17.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
